server:
  port: 8084

spring:
  application:
    name: inventory-service

  # ===================================================================
  #  KẾT NỐI RIÊNG tới inventory_db. Khác hoàn toàn user-service:
  #  - database khác:    inventory_db (vs user_db)
  #  - credentials khác: inventory_service_app (vs user_service_app)
  #  - connection pool khác: inventory-service-pool
  #  => Hai service KHÔNG dùng chung kết nối.
  # ===================================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: inventory_service_app
    password: inventory_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inventory-service-pool
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update      # tự tạo bảng products trong inventory_db
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
