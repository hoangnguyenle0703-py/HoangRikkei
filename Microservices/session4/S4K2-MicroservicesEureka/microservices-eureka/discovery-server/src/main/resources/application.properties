# ============================================================
#  Cấu hình Eureka Server (Trạm điều hướng) — chế độ độc lập
# ============================================================

# Cổng mặc định của Eureka Server
server.port=8761

# Tên ứng dụng
spring.application.name=discovery-server

# --- Cấu hình quan trọng cho Eureka Server ĐỘC LẬP (standalone) ---
# Bản thân Eureka Server KHÔNG tự đăng ký mình như một client
eureka.client.register-with-eureka=false
# Eureka Server KHÔNG cần kéo (fetch) danh sách registry về (vì nó chính là registry)
eureka.client.fetch-registry=false

# Địa chỉ của chính Eureka Server (dùng cho client trỏ tới)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Tắt cơ chế tự bảo vệ trong môi trường dev để dashboard cập nhật nhanh
# (Trong môi trường production nên để mặc định là true)
eureka.server.enable-self-preservation=false
