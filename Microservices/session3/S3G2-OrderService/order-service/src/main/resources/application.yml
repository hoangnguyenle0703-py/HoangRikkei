server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server.error:
  include-stacktrace: never
  include-message: never

# Địa chỉ Product Service để lấy giá (gọi qua API, không truy cập product_db)
product-service:
  url: http://localhost:8082
