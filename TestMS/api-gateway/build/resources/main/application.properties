spring.application.name=api-gateway
server.port=8080

# ---------- Dang ky vao Eureka ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---------- Task 1: Dinh tuyen request ----------
# lb:// = load balanced theo SERVICE-ID lay tu Eureka, KHONG hard-code IP:Port.
# Khi scale Order Service len nhieu instance, Gateway tu chia tai ma khong doi cau hinh.
spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[1].id=inventory-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/inventory/**

# ---------- Actuator (xem danh sach route dang hoat dong) ----------
management.endpoints.web.exposure.include=health,gateway
management.endpoint.gateway.access=unrestricted

logging.level.com.example.apigateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
